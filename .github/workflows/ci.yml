name: CI

# Run these checks on every push to any branch, and on every pull request.
on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next.js auto-generates route types (like LayoutProps) that tsc needs.
      # A clean CI checkout has none yet, so generate them before type-checking.
      - run: npx next typegen
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    # The build imports the Supabase client, which refuses to load without keys.
    # These are harmless PLACEHOLDERS — the build never calls Supabase, and the
    # anon key is public-safe anyway. Real keys never go in this file.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Validates the Week 1 Claude Skills in .claude/skills on every push.
      # The script is dependency-free, so no npm install is needed here.
      - run: node scripts/check-skills.mjs